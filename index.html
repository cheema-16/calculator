<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white">

    <!-- Main Box -->
    <div class="w-[50%] max-w-[900px] mx-auto mt-12 border-4 border-gray-400 p-10">

        <!-- Heading -->
        <h1 class="text-5xl font-bold text-center text-gray-600 mb-10">
            Calculator
        </h1>

        <!-- First Number -->
        <input type="number" id="num1" placeholder="Enter first number"
            class="w-full h-18 border-2 border-gray-400 px-8 text-3xl outline-none mb-2">

        <!-- Second Number -->
        <input type="number" id="num2" placeholder="Enter second number"
            class="w-full h-18 border-2 border-gray-400 px-8 text-3xl outline-none mb-10">

        <!-- Buttons -->
        <div class="flex justify-center gap-10">

            <button onclick="calculate('+')" class="w-28 h-18 border-2 border-gray-400 text-4xl text-gray-600">
                +
            </button>

            <button onclick="calculate('-')" class="w-28 h-18 border-2 border-gray-400 text-4xl text-gray-600">
                -
            </button>

            <button onclick="calculate('*')" class="w-28 h-18 border-2 border-gray-400 text-4xl text-gray-600">
                *
            </button>

            <button onclick="calculate('/')" class="w-28 h-18 border-2 border-gray-400 text-4xl text-gray-600">
                /
            </button>

        </div>

        <!-- Result -->
        <h2 class="text-5xl font-bold text-center text-gray-600 mt-8">
            Result
        </h2>

        <p id="result" class="text-4xl text-center text-gray-600 mt-6">
            0
        </p>

    </div>


    <!-- JavaScript -->
    <script>

        function calculate(operator) {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let result;

            if (operator == "+") {
                result = num1 + num2;
            }

            else if (operator == "-") {
                result = num1 - num2;
            }

            else if (operator == "*") {
                result = num1 * num2;
            }

            else if (operator == "/") {

                if (num2 == 0) {
                    result = "Cannot divide by zero";
                }

                else {
                    result = num1 / num2;
                }
            }

            document.getElementById("result").innerText = result;
        }

    </script>

</body>

</html>
